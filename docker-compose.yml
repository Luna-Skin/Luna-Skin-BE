version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: lunaskin
      POSTGRES_USER: lunaskin
      POSTGRES_PASSWORD: lunaskin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db
    env_file:
      - .env

volumes:
  postgres_data: