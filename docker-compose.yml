version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: lunaskin
      POSTGRES_USER: ${DB_USERNAME:-lunaskin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lunaskin123}
      TZ: Asia/Seoul # 컨테이너 OS 타임존 설정
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: postgres -c timezone=Asia/Seoul # PostgreSQL 내부 설정으로 타임존 강제 고정

  app:
    build: .
    image: ${DOCKERHUB_USERNAME:-lunaskin}/luna-skin-backend:latest
    ports:
      - "8080:8080"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/lunaskin
      TZ: Asia/Seoul

volumes:
  postgres_data: