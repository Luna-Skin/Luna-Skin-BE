version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: lunaskin
      POSTGRES_USER: lunaskin
      POSTGRES_PASSWORD: lunaskin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lunaskin
      SPRING_DATASOURCE_USERNAME: lunaskin
      SPRING_DATASOURCE_PASSWORD: lunaskin123

volumes:
  postgres_data: