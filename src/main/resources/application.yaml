spring:
  application:
    name: luna

  datasource:
    url: jdbc:postgresql://localhost:5432/lunaskin
    username: lunaskin
    password: lunaskin123

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    com.lunaskin: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

luna-skin:
  storage:
    local:
      base-dir: ${STORAGE_BASE_DIR:./uploads}
      base-url: ${STORAGE_BASE_URL:/files}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      endpoint: https://api.openai.com/v1
      model: ${OPENAI_MODEL:gpt-4o-mini}